name: Publish v1.3.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node tests/test_firewall.js
      - name: Create first GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.3 >/dev/null 2>&1; then
            echo "Release v1.3.3 already exists."
          else
            gh release create v1.3.3 --target "$GITHUB_SHA" --title "DNPHSEE v1.3.3" --notes-file RELEASE_NOTES.md
          fi
